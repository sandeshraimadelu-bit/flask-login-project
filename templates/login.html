<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        * {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
}

.login-container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 350px;
    padding: 35px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
}

.login-box h1 {
    text-align: center;
    margin-bottom: 10px;
}

.login-box p {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 18px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 5px;
    background: #007bff;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

.register {
    margin-top: 20px;
    font-size: 14px;
}

.register a {
    color: #007bff;
    text-decoration: none;
}
</style>


    
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>Welcome Back</h1>
            <p>Login to your account</p>

            <form action="/login" method="POST">

                <label>Email</label>
                <input type="email" name="email"
                       placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" name="password"
                       placeholder="Enter your password" required>

                <button type="submit">Login</button>

            </form>

            <p class="register">
                Don't have an account?
                <a href="#">Register</a>
            </p>

        </div>

    </div>

</body>
</html>
